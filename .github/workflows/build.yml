name: Build NeoRoblox

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Kotlin compile check
        run: gradle :app:compileDebugKotlin --stacktrace

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        env:
          ROBLOX_CLIENT_ID: ${{ secrets.ROBLOX_CLIENT_ID }}
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NeoRoblox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
